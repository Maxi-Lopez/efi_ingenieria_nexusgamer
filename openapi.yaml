components:
  schemas:
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - nombre
    Compra:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proveedor:
          type: integer
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        estado:
          $ref: '#/components/schemas/EstadoFbdEnum'
        nro_factura:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - proveedor
    CompraList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proveedor:
          allOf:
          - $ref: '#/components/schemas/Proveedor'
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        estado:
          $ref: '#/components/schemas/EstadoFbdEnum'
        nro_factura:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleCompra'
          readOnly: true
      required:
      - created_at
      - detalles
      - id
      - is_active
      - proveedor
    DetalleCompra:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        compra:
          type: integer
        producto:
          type: integer
        unidades:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - compra
      - created_at
      - id
      - is_active
      - precio
      - producto
    DetalleVenta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        venta:
          type: integer
        producto:
          allOf:
          - $ref: '#/components/schemas/ProductoList'
          readOnly: true
        unidades:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - precio_unitario
      - producto
      - venta
    Estado9d5Enum:
      enum:
      - pendiente
      - completada
      - cancelada
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `completada` - Completada
        * `cancelada` - Cancelada
    EstadoFbdEnum:
      enum:
      - pendiente
      - recibida
      - cancelada
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `recibida` - Recibida
        * `cancelada` - Cancelada
    ListaDeseosGet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          allOf:
          - $ref: '#/components/schemas/UsuarioPublic'
          readOnly: true
        producto:
          allOf:
          - $ref: '#/components/schemas/ProductoList'
          readOnly: true
      required:
      - id
      - producto
      - usuario
    ListaDeseosPost:
      type: object
      properties:
        producto:
          type: integer
          nullable: true
    Marca:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        logo:
          type: string
          maxLength: 500
        descripcion:
          type: string
        pais_origen:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - nombre
    MyTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    PaginatedCategoriaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
